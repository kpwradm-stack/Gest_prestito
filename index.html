<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoanFlow - Gestione Prestito</title>
  <!-- Tailwind CSS per la grafica dark/neon -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js per il grafico a ciambella/contachilometri -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
    }
    .neon-text-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="glass-card p-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-cyan-400 neon-text-cyan">LoanFlow Dashboard</h1>
        <p class="text-xs text-slate-400">Monitoraggio e rientro prestito in tempo reale</p>
      </div>
      <button onclick="fetchData()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg shadow transition">
        🔄 Aggiorna
      </button>
    </header>

    <!-- KPI Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="glass-card p-5">
        <span class="text-xs font-medium text-slate-400">Totale Prestito</span>
        <div id="totalePrestito" class="text-2xl font-extrabold text-white mt-1">€ 0,00</div>
      </div>
      <div class="glass-card p-5">
        <span class="text-xs font-medium text-slate-400">Totale Rimborsato</span>
        <div id="totaleVersato" class="text-2xl font-extrabold text-emerald-400 mt-1">€ 0,00</div>
      </div>
      <div class="glass-card p-5">
        <span class="text-xs font-medium text-slate-400">Rimanente</span>
        <div id="totaleRimanente" class="text-2xl font-extrabold text-rose-400 mt-1">€ 0,00</div>
      </div>
    </div>

    <!-- Sezione Grafico e ProgressBar -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Grafico a Ciambella (Contachilometri) -->
      <div class="glass-card p-6 flex flex-col items-center justify-center relative">
        <h2 class="text-sm font-semibold text-slate-300 mb-4 w-full text-left">Avanzamento Rientro</h2>
        <div class="w-48 h-48 relative">
          <canvas id="gaugeChart"></canvas>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="percentageText" class="text-2xl font-black text-cyan-400">0%</span>
            <span class="text-[10px] text-slate-400 uppercase tracking-widest">Completato</span>
          </div>
        </div>
      </div>

      <!-- Barra di progresso e Dettagli Tipo -->
      <div class="glass-card p-6 flex flex-col justify-between">
        <div>
          <h2 class="text-sm font-semibold text-slate-300 mb-2">Obiettivo Rientro</h2>
          <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700">
            <div id="progressBar" class="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>

        <div class="mt-6 space-y-2">
          <h3 class="text-xs font-semibold text-slate-400 uppercase">Ripartizione per Metodo</h3>
          <div id="metodiList" class="space-y-1.5 text-xs text-slate-300">
            <!-- Dinamico -->
          </div>
        </div>
      </div>

    </div>

    <!-- Tabella Storico Versamenti -->
    <div class="glass-card p-6">
      <h2 class="text-sm font-semibold text-slate-300 mb-4">Storico Movimenti</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="text-slate-400 border-b border-slate-700 uppercase">
            <tr>
              <th class="pb-2">Data</th>
              <th class="pb-2">Tipo</th>
              <th class="pb-2 text-right">Importo</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800 text-slate-200">
            <!-- Righe inserite via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SHEET_ID = "1wbHUWrh8xFj2pgptrQCqpBjR_RorKPVsopfODugHkug";
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    let myChart = null;

    function cleanNumber(val) {
      if (!val) return 0;
      let str = val.toString().replace(/"/g, '').trim();
      str = str.replace(',', '.');
      const parts = str.split('.');
      if (parts.length > 2) {
        str = parts[0] + '.' + parts.slice(1).join('');
      }
      const num = parseFloat(str);
      return isNaN(num) ? 0 : num;
    }

    function formatEuro(val) {
      return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(val);
    }

    async function fetchData() {
      try {
        const response = await fetch(SHEET_URL);
        const csvText = await response.text();
        
        const lines = csvText.split('\n');
        let totalePrestito = 0;
        let totaleVersato = 0;
        const versamenti = [];
        const tipiMap = {};

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue; // Salta righe vuote

          // Regex robusta per separare i campi CSV anche con eventuali virgole interne
          const row = line.split(',').map(cell => cell.replace(/^"|"\$/g, '').trim());
          if (row.length < 3) continue;

          const dataVal = row[0];
          const importoVal = cleanNumber(row[1]);
          const tipoVal = row[2] || 'Altro';
          const prestitoVal = row[3] ? cleanNumber(row[3]) : 0;

          if (prestitoVal > 0 && totalePrestito === 0) {
            totalePrestito = prestitoVal;
          }

          if (importoVal > 0 && dataVal) {
            totaleVersato += importoVal;
            versamenti.push({ data: dataVal, importo: importoVal, tipo: tipoVal });
            tipiMap[tipoVal] = (tipiMap[tipoVal] || 0) + importoVal;
          }
        }

        // Se non trova il totale prestito dalla colonna D, imposta una fallback di sicurezza o usa i dati
        if (totalePrestito === 0) {
          totalePrestito = 1500.00; // Valore di default se la cella è vuota
        }

        const rimanente = Math.max(0, totalePrestito - totaleVersato);
        const percentuale = totalePrestito > 0 ? Math.min(100, (totaleVersato / totalePrestito) * 100) : 0;

        document.getElementById('totalePrestito').innerText = formatEuro(totalePrestito);
        document.getElementById('totaleVersato').innerText = formatEuro(totaleVersato);
        document.getElementById('totaleRimanente').innerText = formatEuro(rimanente);
        document.getElementById('percentageText').innerText = `${percentuale.toFixed(1)}%`;
        document.getElementById('progressBar').style.width = `${percentuale}%`;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        versamenti.reverse().forEach(v => {
          tbody.innerHTML += `
            <tr class="hover:bg-slate-800/50">
              <td class="py-2.5">${v.data}</td>
              <td class="py-2.5"><span class="px-2 py-0.5 bg-slate-800 text-cyan-300 rounded text-[10px]">${v.tipo}</span></td>
              <td class="py-2.5 text-right font-semibold text-emerald-400">${formatEuro(v.importo)}</td>
            </tr>
          `;
        });

        const metodiList = document.getElementById('metodiList');
        metodiList.innerHTML = '';
        Object.entries(tipiMap).forEach(([tipo, val]) => {
          metodiList.innerHTML += `
            <div class="flex justify-between items-center">
              <span class="text-slate-400">${tipo}</span>
              <span class="font-medium text-slate-200">${formatEuro(val)}</span>
            </div>
          `;
        });

        updateChart(totaleVersato, rimanente);

      } catch (err) {
        console.error("Errore caricamento dati:", err);
      }
    }

    function updateChart(versato, rimanente) {
      const ctx = document.getElementById('gaugeChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Versato', 'Rimanente'],
          datasets: [{
            data: [versato, rimanente],
            backgroundColor: ['#10b981', '#334155'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          cutout: '80%',
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true }
          },
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    fetchData();
  </script>
</body>
</html>
